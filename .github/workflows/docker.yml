##
# File: .github/workflows/docker.yml
# Build and publish the Acuparse container image to GitHub Container Registry
##

name: Docker Image

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: PHP syntax check
        run: find src cron -name '*.php' -not -path 'src/pub/lib/*' -print0 | xargs -0 -n1 php -d display_errors=stderr -l > /dev/null

      # Report only: lists PHP 8.4 compatibility issues without failing the build
      - name: PHP 8.4 compatibility report
        continue-on-error: true
        run: |
          composer global config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --quiet "phpcompatibility/php-compatibility:dev-develop" dealerdirect/phpcodesniffer-composer-installer
          "$(composer global config bin-dir --absolute --quiet)/phpcs" --standard=PHPCompatibility --runtime-set testVersion 8.4 --extensions=php --ignore='src/pub/lib/*' --report=summary --report-full src cron

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: version
        run: echo "version=$(jq -r .VERSION .version)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
